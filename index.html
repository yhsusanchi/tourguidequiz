<style>
:root{--ink:#14213d;--sub:#5b6b86;--bg:#e9eff4;--card:#fff;--line:#d3dde7;--ok:#1f7a5c;--okbg:#e2f4ec;--bad:#c8372d;--badbg:#fbe9e7;--acc:#2f5fa8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px;letter-spacing:.06em}header small{opacity:.75;display:block;font-size:12px}
header button{background:none;border:1px solid #ffffff66;color:#fff;border-radius:8px;padding:4px 10px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
.pass{border-top:6px solid var(--acc);position:relative}
.pass .no{font-weight:700;color:var(--acc)}
.tag{display:inline-block;font-size:12px;color:var(--acc);border:1px solid var(--acc);border-radius:99px;padding:0 8px;margin-left:6px;white-space:nowrap}
.q{white-space:pre-line;margin:6px 0 10px}.ctx{white-space:pre-line;background:#f3f6f9;border-left:3px solid var(--line);padding:8px 10px;font-size:14px;margin-bottom:8px;max-height:200px;overflow:auto}
.opt{display:flex;gap:8px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0;font:inherit;color:inherit}
.opt i{font-style:normal;font-weight:700;min-width:22px;color:var(--sub)}
.opt.sel{border-color:var(--acc);background:#eaf1fb}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.res{font-weight:700;margin-top:6px}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.btn{width:100%;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700}
.btn:disabled{background:#9aa9bf}
.stamp{width:130px;height:130px;border:4px solid var(--bad);color:var(--bad);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:10px auto;transform:rotate(-8deg);font-weight:700}
.stamp.pass-ok{border-color:var(--ok);color:var(--ok)}.stamp b{font-size:40px;line-height:1}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar span{display:block;height:100%;background:var(--acc)}
.foot{color:var(--sub);font-size:13px;text-align:center;margin:10px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:9}

input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;margin:10px 0}
.warn{background:#fff6e0;border:1px solid #f0d58a;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:10px}

const DB_URL="https://tourguide-b4c2c-default-rtdb.asia-southeast1.firebasedatabase.app";/* 貼上 Firebase Realtime Database 網址，例如 https://xxx-default-rtdb.firebaseio.com */
const B={"passages":{"4501-71":"Global warming and environmental problems raise people’s environmental concerns and increase their environmental responsibility in their buying. Countries all over the world are increasingly emphasizing environmental conservation matters. Green consumers are those who are aware of and interested in environmental issues. They support businesses that run in environmentally friendly ways. In addition, green consumers are also concerned about how green the products they bought are. Green products are products that are non-toxic, made from recycled materials, or minimally packaged. In general, green products are known as ecological products or environmentally friendly products that impact less on the environment. The goal of green marketing is bringing environment issue into marketing. If we can make consumers consider that information of environmental protection during their decision process, we can push companies to produce more environmentally friendly products. Although the tourism and hospitality industry is also referred to as the non-factory-made industry, companies are still trying hard toward the goal of sustainable development. In Taiwan, the government took several ways to encourage sustainability development in the industry. For example, the Environmental Protection Administration (EPA) held a reward program that customers could earn “green points” after dinning at environmentally friendly restaurants.","4501-76":"The sea turtle has been a species at high risk of extinction for many years. In Taiwan, Xiaoliuqiu (also called Little Liuqiu or Liuqiu), an island belonging to Pingtung County in Taiwan has a high number of sea turtles, and the majority of the residents there have been aware of the importance of protecting sea turtles. However, the island has so many tourist attractions that many visitors come to the island on weekends and holidays. They come for scuba diving, SUP (stand-up paddling), snorkeling, and so on. Although these activities promote local economic growth, it leads to some influences on marine life and the environment. To decrease the burden on the environment, a team of volunteers, consisting of university students in Taiwan, non-profit organizations, and residents have started to conduct a project about environmental protection, including sea turtle conservation and marine-debris decoration. The team observes the life of sea turtles, keeping records of their migration behaviors. The team also has a sea turtle patrol at night from 7:00 p.m. to 5:00 a.m., learning about how sea turtles lay their eggs. On the other hand, the team conducts beach clean-ups every day. The volunteers collect marine debris to create an art wall near the beach. This decoration wall aims to remind visitors that they should reduce pollution and disturbance. The head of the team says the volunteers will take more actions to keep the island green.","4201-71":"In the past few years, most major airlines have announced their plans to use commercial electric airplanes. Travelers can soon travel to different places via an electric aircraft. Take United Airlines for example. They will offer fossil fuel-free domestic flights by 2026. In addition, Sweden and Denmark also declared their plans to use fossil fuel-free electric-powered airplanes by 2030. Electric air travel (i.e. traveling with an electric-powered aircraft) is going mainstream. There are various methods to supply electricity; however, the most common way is to use batteries. The climate crisis has been worsening these past few years. One of the major contributors to this environmental problem is air transportation. The aviation sector has released huge amounts of carbon dioxide (CO2) into the atmosphere every year. Unfortunately, airplanes are predicted to triple their CO2 emissions by 2050 if left unchecked now. Most major airlines have thus signed up to meet the targeted net-zero carbon emissions by 2050. Governments from many different countries are establishing policies to help protect the environment. Austria and France have enacted bans on short-haul domestic flights. In the United States of America, the government is also pushing to reduce CO2 emissions through clean-energy transportation. As presented, the use of small electric airplanes is the first step towards greener air travel. The development of larger electric planes may take several years. Still, you can expect to hear that electric air travel will be going mainstream in the coming years.","4201-76":"I was filled with excitement and awe as our vehicle jolted down the muddy paths of the wildlife reserve. Incredible creatures roamed the savannah, and the sceneries itself were some of the most stunning I’ve ever seen. Safari traveling is a thrilling and one-of-a-kind opportunity to take in the splendor and variety of the natural world. In order to see and photograph wild creatures in their natural environment, safari vacationers often visit an African wildlife reserve or national park. In my experience, seeing iconic and endangered animals like lions, elephants, and gorillas in their natural habitats is expected to be a staple of a safari vacation. My favorite part of the trip was getting to see a group of wild canine animals in their natural habitat. I’d never had such a good look at these endangered creatures before. Aside from getting an up-close glimpse at the animals, tourists can receive insight into their habits and routines from knowledgeable guides on several safari programs that include guided drives within the park. Safaris sometimes involve more than just visits to zoos and sanctuaries to see animals; they often provide opportunities for hiking, birdwatching, and cultural immersion. Memories created on the safari journey will last a lifetime since it was truly once in a lifetime opportunity. I think a trip to Africa for a safari would be amazing if you have the chance to go. You won’t soon forget this incredible journey."},"questions":[{"id":"1501-01","subj":"領隊實務(一)","track":"領隊","q":"解說標誌牌是重要解說工具，具有下列那些優點？\n①自導性標示，遊客可以自我控制資訊內容\n②裝配得當的標誌，耐用時間較久\n③單向溝通，適合所有遊客之興趣、年齡及教育程度\n④標示任何時間均可適用，可代替解說員之不足","o":["①②③","①②④","①③④","②③④"],"a":"B","ok":"B","dup":[]},{"id":"1501-02","subj":"領隊實務(一)","track":"領隊","q":"在行進間導覽解說技巧，應注意下列那些事項？\n①整潔有禮的儀態，顯現專業與安全感\n②選定位置，方便與團員清楚溝通\n③說話速度讓團員快速融入情境\n④領隊在前，導遊在後，注意動線安全\n⑤不忘預留上廁所時間","o":["①②③④","①②③⑤","①③④⑤","②③④⑤"],"a":"B","ok":"B","dup":[]},{"id":"1501-03","subj":"領隊實務(一)","track":"領隊","q":"有旅客擬前往 DPS，旅行業工作人員建議搭乘那家的航空公司可以直飛抵達？","o":["CX","CZ","OD","GA"],"a":"D","ok":"ABCD","dup":[]},{"id":"1501-04","subj":"領隊實務(一)","track":"領隊","q":"遊程規劃需特別留意團體機票的那一規則或限制，以免安排行程導致成本增加？","o":["開票地點","開票期限","開票中心的限制","停留天數的限制"],"a":"D","ok":"D","dup":[]},{"id":"1501-05","subj":"領隊實務(一)","track":"領隊","q":"下列那一項不是團員於團體出發前必須繳交的成本費用？","o":["機票燃油附加費","隨票徵收的機場稅","額外自費行程","責任險費用"],"a":"C","ok":"C","dup":[]},{"id":"1501-06","subj":"領隊實務(一)","track":"領隊","q":"下列何者為在有限時間內從事解說的最適宜原則？","o":["應有計畫性的安排及解說","於長途拉車途中，縮短每次停車休息的時間","減少「入內參觀」的節目，以有效地運用時間","於長途拉車的車上，儘量事先完成景點的解說"],"a":"A","ok":"A","dup":[]},{"id":"1501-07","subj":"領隊實務(一)","track":"領隊","q":"行程進行中，如進入特定購物店，領隊應掌握下列什麼事項？","o":["如有任何人不願意進入就不可以入店","大部分的旅客購物興致高，影響一點參觀行程無所謂","購物店內有部分貨品可能是仿冒品，領隊不必提醒","宣布停留一定時間，提醒索取收據"],"a":"D","ok":"D","dup":[]},{"id":"1501-08","subj":"領隊實務(一)","track":"領隊","q":"西餐用餐時，餐具不慎掉落，下列敘述何者較恰當？","o":["請鄰座女士代撿起","請鄰座男士代撿起","請服務生代撿起","自己撿起"],"a":"C","ok":"C","dup":[]},{"id":"1501-09","subj":"領隊實務(一)","track":"領隊","q":"目前全球航空聯盟分別有星空聯盟（Star Alliance）、天合聯盟（SkyTeam）及寰宇一家（One World）等，中華航空是屬於那一個聯盟的成員？","o":["星空聯盟","天合聯盟","寰宇一家","價值聯盟"],"a":"B","ok":"B","dup":[]},{"id":"1501-10","subj":"領隊實務(一)","track":"領隊","q":"長榮航空 BR075 由臺北飛阿姆斯特丹，航班中停曼谷，且在曼谷可運載或卸下客貨，請問這是使用那一種國際航權？","o":["第三航權（卸載權）","第四航權（裝載權）","第五航權（延遠權）","第六航權（橋樑權）"],"a":"C","ok":"C","dup":[]},{"id":"1501-11","subj":"領隊實務(一)","track":"領隊","q":"受新冠疫情衝擊影響，航空旅遊產業嚴重受挫，國際航線幾乎停擺。請問臺灣於 2021 年 4 月開放實施第一個「旅遊泡泡」成行的國家是？","o":["泰國","新加坡","帛琉","關島"],"a":"C","ok":"C","dup":[]},{"id":"1501-12","subj":"領隊實務(一)","track":"領隊","q":"目前中華民國國民可以免簽證前往的國家中，不包含下列那個國家？","o":["紐西蘭","法國","泰國","日本"],"a":"C","ok":"C","dup":[]},{"id":"1501-13","subj":"領隊實務(一)","track":"領隊","q":"依據民用航空法，有關旅客搭乘飛機上電子用品使用的規定，下列敘述何者錯誤？","o":["使用電子醫療裝備需自備電池","飛航全程可使用藍牙裝置","助聽器及心律調整器之使用受到限制","飛機落地脫離跑道前，禁止使用電子用品語音通話"],"a":"C","ok":"C","dup":[]},{"id":"1501-14","subj":"領隊實務(一)","track":"領隊","q":"機票行程若經由或停留某一特定城市時，航空公司同意給予特定的哩程寬減數，此規則稱為：","o":["EMS","EMA","MPM","TPM"],"a":"B","ok":"B","dup":[]},{"id":"1501-15","subj":"領隊實務(一)","track":"領隊","q":"旅客高齡 80 歲行動緩慢，但仍可自行走幾步路及上下階梯，請問旅行社若要幫此旅客向航空公司需求輪椅，應於訂位紀錄中輸入何種輪椅代碼？","o":["WCHS","WCHC","WCHR","WCHP"],"a":"C","ok":"C","dup":[]},{"id":"1501-16","subj":"領隊實務(一)","track":"領隊","q":"搭乘電梯的禮儀，下列敘述何者最為恰當？","o":["進入電梯，應禮貌性地將外套、圍巾或帽子脫掉","為克服「密室恐懼症」，可與同在電梯內的人說話聊天，減輕心理壓力","電梯乘客較多時，且自己距離按鈕略遠，為免他人不便，應伸手越過他人，按下自己的樓層","當自己雙手提有物品不便按鈕時，可請人協助按鈕"],"a":"D","ok":"D","dup":[]},{"id":"1501-17","subj":"領隊實務(一)","track":"領隊","q":"使用刀叉食用餐點時，下列敘述何者符合西餐禮儀？","o":["隨自己用餐方便與喜好取用刀叉","擺放在餐盤最外側的刀叉先取用","擺放在靠近餐盤內側的刀叉先取用","從排列的餐具中間挑選習慣的取用"],"a":"B","ok":"B","dup":[]},{"id":"1501-18","subj":"領隊實務(一)","track":"領隊","q":"有關登門拜訪他人的行為，下列那項最符合作客禮儀？","o":["拜訪前先聯繫對方，約定拜訪時間","交情深的友人，應採突然拜訪，給對方驚喜","抵達拜訪親友處時，要急按多次電鈴以免無人應門","進入室內時，應脫去鞋襪"],"a":"A","ok":"A","dup":[]},{"id":"1501-19","subj":"領隊實務(一)","track":"領隊","q":"男士出席正式宴會場合（Full Dress）時的穿著，下列敘述何者不合乎禮儀？","o":["西裝顏色宜以素雅套裝為原則，以深色、單色為宜","襯衫袖口應比西裝衣袖長 2 公分左右為宜","不管 2 粒或 3 粒扣子的單排扣西裝，應全部扣起","穿西裝一定要穿皮鞋，皮鞋顏色要與西裝相搭配"],"a":"C","ok":"C","dup":[]},{"id":"1501-20","subj":"領隊實務(一)","track":"領隊","q":"進行水域、沙灘活動時，下列行為何者不宜？","o":["沙灘活動後，垃圾就地掩埋即可","沙灘活動後，前往投宿地點前，須將身上、腳上等砂土沖乾淨再進入室內","沙灘上遊玩拍照時，應以自己的團體為主，不可以隨意拍其他人，以免觸犯個人隱私","水域活動時，要留意個人身體狀況，切勿逞強，也不要拖人下水，以免造成意外"],"a":"A","ok":"A","dup":[]},{"id":"1501-21","subj":"領隊實務(一)","track":"領隊","q":"有關糖尿病病患照顧之注意事項，下列何者最為適當？","o":["有冒汗、頭暈時應先補充水份","在兩餐之間應監測血糖數值","飯前 30 分鐘從事激烈的運動","濃湯、碎肉製品應儘量少吃"],"a":"D","ok":"D","dup":[]},{"id":"1501-22","subj":"領隊實務(一)","track":"領隊","q":"通常因接觸火焰、乾熱、化學藥品等而受到灼傷時，成人全層皮膚灼傷（三度灼傷）超過體表總面積約多少百分比以上，較會有生命危險？","o":["5","10","15","20"],"a":"D","ok":"BCD","dup":[]},{"id":"1501-23","subj":"領隊實務(一)","track":"領隊","q":"下列那一項不是目前國際檢疫傳染病？","o":["霍亂","瘧疾","黃熱病","鼠疫"],"a":"B","ok":"B","dup":[]},{"id":"1501-24","subj":"領隊實務(一)","track":"領隊","q":"下列何者無法有效預防旅行者腹瀉？","o":["不要食用攤販食物","不要生食或沒煮熟的食物","飯前洗手","多喝自來水"],"a":"D","ok":"D","dup":[]},{"id":"1501-25","subj":"領隊實務(一)","track":"領隊","q":"有關日本腦炎之敘述，下列何者錯誤？","o":["經由埃及斑蚊傳染","潛伏期 5～15 日","可能發生頭痛、發燒及肌肉僵硬症狀","會經由環紋（狀）家蚊傳染"],"a":"A","ok":"A","dup":[]},{"id":"1501-26","subj":"領隊實務(一)","track":"領隊","q":"發現一位路倒的患者，首先應評估那一種狀態？","o":["呼吸","意識","脈搏","是否有傷口"],"a":"B","ok":"B","dup":[]},{"id":"1501-27","subj":"領隊實務(一)","track":"領隊","q":"衛生福利部疾病管制署建議民眾出國至少多久前，至旅遊醫學門診就診？","o":["出國前 24 小時","出國前 3 天","出國前 1 星期","出國前 2～4 星期"],"a":"D","ok":"D","dup":[]},{"id":"1501-28","subj":"領隊實務(一)","track":"領隊","q":"為預防團員走失或失蹤，領隊人員可採取的作法，下列敘述何者錯誤？","o":["入住旅館後，提醒團員盡量不要單獨離開飯店，若要外出遊逛，必須結伴並攜帶飯店電話及地址等資訊","確實掌握團員的聯絡方式，例如：手機號碼、善用手機通訊軟體，以方便聯絡","每次宣布集合地點及時間時，需確定每位團員都已確實接收到相關資訊","提醒團員若走失時不要慌張，領隊人員一定會回頭搜尋，團員可在景點附近到處走動，提高領隊人員尋獲的機會"],"a":"D","ok":"D","dup":[]},{"id":"1501-29","subj":"領隊實務(一)","track":"領隊","q":"當團員在旅途中發生傷病事故，領隊人員之處理原則下列何者最不適當？","o":["若團員需要送醫急救或住院，只要請同伴留在醫院照顧即可，領隊人員應繼續帶領其他團員完成後續行程","領隊人員必須協助團員申請或收集相關醫療單據與醫師診斷證明，以備後續保險理賠之需要","必須向家屬說明相關醫療費用的支付原則，例如因個人疾病所衍生之住院費用，須由團員自行負擔","發生團員傷病狀況，領隊人員在處理好病人之後，需向其他團員說明狀況，以安撫團員心裡之疑慮或不安"],"a":"A","ok":"A","dup":[]},{"id":"1501-30","subj":"領隊實務(一)","track":"領隊","q":"團員在旅途中突發病症，領隊人員的處理方式，下列何者最不適當？","o":["領隊人員帶團時可攜帶止痛藥，當有團員需要的時候，可以視症狀給予服用，以緩解疼痛，再帶團員去就醫","若團員狀況嚴重，必須安排就醫，並應尋求當地接待旅行社安排人員在醫院協助及照顧","若安排團員住院治療，則必須通報出團旅行社及團員家屬","團員經過治療後，醫生評斷可繼續完成旅程，領隊人員應隨時注意團員狀況，並回報訊息給出團旅行社相關部門"],"a":"A","ok":"A","dup":[]},{"id":"1501-31","subj":"領隊實務(一)","track":"領隊","q":"旅途中，旅客身體不適，緊急送醫治療，經治療情況雖有好轉，但醫生表示仍需住院觀察。關於上述個案，下列敘述何者錯誤？","o":["旅行社出國已保旅行業責任險，所以旅客產生的醫療費用應該由旅行社支付","旅途中生病，費用不應由旅行社支付","旅行社投保的責任保險範圍中不包括疾病醫療費用給付","旅客於途中生病，旅行社應盡善良管理人之注意，協助旅客處理"],"a":"A","ok":"A","dup":[]},{"id":"1501-32","subj":"領隊實務(一)","track":"領隊","q":"旅客不顧領隊人員勸阻，執意於警戒區外海泳卻溺斃，且領隊人員未領有執業證，誰應對此負責賠償？","o":["旅客本身","領隊人員","旅行社","保險公司"],"a":"A","ok":"A","dup":[]},{"id":"1501-33","subj":"領隊實務(一)","track":"領隊","q":"寒暑假的海外親子團很受到國人歡迎，當領隊人員發現團員中有未滿 14 歲的小孩護照遺失，申請補發之護照效期以幾年為限？","o":["4年","3年","2年","1年"],"a":"B","ok":"B","dup":[]},{"id":"1501-34","subj":"領隊實務(一)","track":"領隊","q":"有關旅遊保險之敘述，下列何者錯誤？","o":["並非所有的保險皆包含國外財物被竊或遺失，出國前應先確認","旅遊前，現有保險最好可支付出國期間的所有醫藥及住院費用，因為在國外醫療住院費用相當昂貴","依據衛生福利部中央健康保險署規定不得申請核退在國外發生的緊急傷病醫療費用，僅能由個人保險來支付","旅行前，最好購買含有國外醫療服務之旅遊保險，以免無法申請理賠"],"a":"C","ok":"C","dup":[]},{"id":"1501-35","subj":"領隊實務(一)","track":"領隊","q":"王大明於倫敦遺失護照，僅獲駐外館處發給入國證明書，持憑證返國，回國後欲申請補發時，可以免繳附下列何種證明文件？","o":["入國許可證副本","身分證或戶籍謄本正本","我國警察機關報案證明","外交部領事事務局之護照遺失作廢申報表"],"a":"C","ok":"C","dup":[]},{"id":"1501-36","subj":"領隊實務(一)","track":"領隊","q":"依據旅行業責任保險相關規定，旅客個人護照遺失時，領隊人員應協助失主於多久時間內向警方或我國駐外有關單位等報案，其重製旅遊文件的合理必要費用，才能獲得保險公司理賠？","o":["24 小時","72 小時","1 星期","1 個月"],"a":"A","ok":"A","dup":[]},{"id":"1501-37","subj":"領隊實務(一)","track":"領隊","q":"旅客選擇參加海外團體旅遊欲辦理簽證時，發現護照在國內遺失，下列敘述何者錯誤？","o":["本人須持身分證明文件親自向國內警察局報案","持警察機關核發之護照遺失申報表正本申請補發護照","一般正常申請補發之護照效期以 5 年為限","未滿 14 歲的小孩護照遺失，申請補發之護照效期以 2 年為限"],"a":"D","ok":"D","dup":[]},{"id":"1501-38","subj":"領隊實務(一)","track":"領隊","q":"領隊人員帶團期間，有關旅客行李在航班運送過程遺失或延遲時之優先處理方式，下列敘述何者錯誤？","o":["領隊人員首先應陪同旅客，備妥相關資料，前往航空公司行李組櫃檯，辦理行李遺失申報手續","行程若涉及一家以上的航空公司轉機作業，領隊人員應陪同旅客，向警察局報案","手提行李是指由旅客帶入客艙自行保管的行李，若手提行李遺失，航空公司將不負損害的責任","因航空公司的緣故造成行李遺失或遲延，旅行社不須負賠償責任，但應協助旅客向航空公司辦理遺失申報的手續，以及後續追查及理賠"],"a":"B","ok":"B","dup":[]},{"id":"1501-39","subj":"領隊實務(一)","track":"領隊","q":"參加旅行社團體旅遊搭機前往海外旅遊時，如遇到行李延遲或遺失，領隊人員可協助團員填寫下列何者文件，以利後續行李尋找與尋獲的寄送？","o":["Passenger Name Record（PNR）","Customs Declaration（CD）","Property Irregularity Report（PIR）","Embarkation/Disembarkation Card（E/D Card）"],"a":"C","ok":"C","dup":[]},{"id":"1501-40","subj":"領隊實務(一)","track":"領隊","q":"出國旅遊往往會因為各種主客觀因素，而產生不同類型的旅遊糾紛，下列有關旅遊糾紛之敘述，何者不是歸屬於領隊專業不足之問題？","o":["不熟悉轉機手續，遲誤中轉班機","對觀光景點不熟悉，解說介紹有誤","對退稅手續不熟悉，導致旅客無法辦理退稅","航空公司機位超售，導致旅客無法成行"],"a":"D","ok":"D","dup":[]},{"id":"1501-41","subj":"領隊實務(一)","track":"領隊","q":"觀光旅遊團體住宿的飯店半夜突然發生火警時，警鈴大響，濃煙密布。領隊人員遇到火警發生危及旅客生命安全，依據緊急處理原則，下列敘述何者錯誤？","o":["速搭乘電梯至每個樓層，高聲喊叫所有團員逃生","時間許可之下迅速敲打和自己同一層樓團員的房門","指引旅客循出口指示方向，由防火梯逃生","以濕毛巾掩住口鼻以防嗆到，以低姿勢逃離"],"a":"A","ok":"A","dup":[]},{"id":"1501-42","subj":"領隊實務(一)","track":"領隊","q":"領隊人員帶團期間，得知團體所預定的航空公司空服員正醞釀罷工，回程航班可能因而取消或延誤。下列敘述何者錯誤？","o":["部分團員急於返國，可提出終止旅遊契約要求，請求旅行社先墊付由當地飛返臺灣之機票費用，旅客應於返國後加息償還給旅行社","在未接獲航空公司正式通知航班取消前，領隊人員仍應依照原訂回程日期及航班時間，帶領團體至機場報到櫃台集合，避免旅客權益受損","若接獲航空公司正式通知回程航班取消，領隊人員應以維護旅客權益為第一優先考量，妥善處理旅客用餐與住宿問題，並安排轉乘其他航班返國","航空公司空服員罷工，屬不可抗力或不可歸責於旅行社與旅客雙方當事人之事由，所有因班機延誤或取消而產生的費用，一律向旅客收取支付"],"a":"D","ok":"D","dup":[]},{"id":"1501-43","subj":"領隊實務(一)","track":"領隊","q":"旅客當初繳付訂金及簽定旅遊契約書時，即明白行程中會安排購物行程，而旅遊第 3、4 天，接連的購物站行程。旅客拒絕下車購物，當地導遊就將旅客留置於車上，場面頗為尷尬。下列敘述與處置何者較為適當？","o":["面對旅客與當地導遊之紛爭，領隊人員應該勸說旅客配合入店購物","面對旅客與當地導遊之紛爭，領隊人員應該勸說導遊放棄購物行程","如果行程表中已載明購物行程，領隊人員強制旅客配合入內參觀購物","如果行程表中已載明購物行程，旅行業者安排旅客前往並無不妥"],"a":"D","ok":"D","dup":[]},{"id":"1501-44","subj":"領隊實務(一)","track":"領隊","q":"歐洲行程，團員常要求領隊人員帶領夜遊活動，以下領隊人員之各個處理選項，何者最不適當？","o":["歐洲地區常有旅客被搶事件，領隊人員應委婉跟團員說明並婉拒帶領夜遊","如果團員堅持前往，應告知將貴重物品寄放保險箱，僅攜帶必要錢財物品","夜遊出門應儘量安排單獨搭乘大眾交通工具，方能分散歹徒覬覦目標","向團員說明，帶領夜遊純屬服務性質，團員亦應照顧自身安全"],"a":"C","ok":"C","dup":[]},{"id":"1501-45","subj":"領隊實務(一)","track":"領隊","q":"下列何者不是旅行業者經常利用附加費用之方式，轉向團體旅遊旅客收取費用之項目？","o":["機票","機場稅","簽證費用","燃油附加費"],"a":"A","ok":"A","dup":[]},{"id":"1501-46","subj":"領隊實務(一)","track":"領隊","q":"旅客參加團費新臺幣 3 萬元之泰國 5 天團體；因 OP 作業疏失，未訂妥回程機位，未能按原定 3 月 7 日中午 13：10 起飛之班機返國，導致旅客留滯曼谷，延到 3 月 8 日下午 19：30 才搭機返國。依國外旅遊定型化契約書範本之規定，旅行社除應負擔旅客留滯期間之食宿及其他必要費用之外，應賠償每名旅客新臺幣多少元？","o":["6 千元","1 萬 2 千元","2 萬 4 千元","3 萬元"],"a":"B","ok":"B","dup":[]},{"id":"1501-47","subj":"領隊實務(一)","track":"領隊","q":"因不可抗力之因素，致旅行社原定之行程無法進行時，下列領隊的處理方式何者較不適當？","o":["提出行程無法進行之原因證明","請客人依據實際狀況，再考量是否更改行程","變更行程後，所減少之費用由領隊繳回旅行社","變更行程後，所增加之費用領隊不得向旅客收取"],"a":"C","ok":"C","dup":[]},{"id":"1501-48","subj":"領隊實務(一)","track":"領隊","q":"仔細聆聽旅客不滿，是屬於下列何種服務補救？","o":["結果正當性","程序正當性","互動正當性","決策正當性"],"a":"C","ok":"C","dup":[]},{"id":"1501-49","subj":"領隊實務(一)","track":"領隊","q":"下列何者不是影響旅客行為的 喪？","o":["1位","2位","3位","4位"],"a":"B","ok":"B","dup":[]},{"id":"1201-26","subj":"導遊實務(一)","track":"導遊","q":"遇到年紀較大或有過敏症、慢性病之團員，導遊人員應在出發前或旅途中提醒或注意之事項，下列敘述何者最不適當？","o":["提醒團員要攜帶超過旅遊天數的慣用藥物，及慢性病處方箋","倘若行程排得太滿，為了不讓團員太過勞累，導遊人員可以自行刪減行程","提醒團員視情況採取必要措施，避免花粉症或空氣污染引起的呼吸器官過敏","旅遊地與出發地若有時差，導遊人員可建議團員按照醫囑服藥"],"a":"B","ok":"B","dup":[]},{"id":"1201-27","subj":"導遊實務(一)","track":"導遊","q":"有關旅行支票的使用與遺失的處理，下列敘述何者錯誤？","o":["旅行支票是支付的貨幣，必須有持票人的親筆簽名才能生效","旅行支票必須與兌換水單分開存放，以備遺失時申請補發","旅遊途中不慎遺失旅行支票時，應立即找當地旅行業者申請掛失","本次旅遊購買的旅行支票若沒使用，可在未來的旅遊中使用"],"a":"C","ok":"C","dup":[]},{"id":"1201-28","subj":"導遊實務(一)","track":"導遊","q":"旅遊途中，導遊人員協助旅客處理物品遺失時，下列敘述何者錯誤？","o":["經確認旅客的託運行李遺失，導遊人員應立即協助向當地警察局報案","入住當地飯店後，在飯店發生行李遺失，導遊人員應協助向警察局報案","在景點參觀時，旅客不慎遺失護照與重要證件，導遊人員應協助向警察局報案","在餐廳用餐時，旅客不慎遺失現金及信用卡，導遊人員應協助向警察局報案"],"a":"A","ok":"A","dup":[]},{"id":"1201-29","subj":"導遊實務(一)","track":"導遊","q":"旅行業依交通部觀光局規定成立緊急事故處理體系，其「緊急事故處理體系表」應載明事項除了「緊急事故發生時之聯絡系統」外，尚包括下列那些選項？\n①文宣系統\n②應變人數之編組與職掌\n③費用之支應\n④責任之歸屬","o":["僅①③","僅①④","僅②③","僅②④"],"a":"C","ok":"C","dup":[]},{"id":"1201-30","subj":"導遊實務(一)","track":"導遊","q":"團體搭乘船舶時的注意事項，下列敘述何者不適當？","o":["搭乘船舶時，安全是最重要的課題，特別是團員中幼小孩童及年長者的安全","搭乘船舶時，船上救生衣及救生小艇的存放位置要再三強調","應跟團員強調在船上欣賞景色或倚靠照相時，要注意安全","夜間在船上進行活動時，應告知團員可以自由單獨行動"],"a":"D","ok":"D","dup":[]},{"id":"1201-31","subj":"導遊實務(一)","track":"導遊","q":"旅遊注意事項，下列敘述何者最為正確？","o":["避免攜帶貴重物品，護照和現金都隨身攜帶，外出時財物儘量集中放置","注意扒手與流浪小孩，手提包揹在後面，以免被扒竊財物","遇到搶劫時，應適度反抗，確保財物安全為重","夜間最好不要單獨外出，避免窄巷或昏暗街道"],"a":"D","ok":"D","dup":[]},{"id":"1201-32","subj":"導遊實務(一)","track":"導遊","q":"如遇航空公司發生罷工事件時，下列何者為導遊人員應優先處理之選項？","o":["安撫旅客，請團員耐心等待罷工事件結束","通知當地旅行社，請當地旅行社作替代性景點旅遊安排","通知駐外單位，以便提供必要的援助","聯絡其它航空公司尋求機位，並要求原航空公司背書轉讓機票"],"a":"D","ok":"D","dup":[]},{"id":"1201-33","subj":"導遊實務(一)","track":"導遊","q":"國外旅行社來臺旅行團之團員，因故要中止行程提早返國，下列導遊處理之做法，何者較為正確？","o":["按旅客意思由其自行脫隊返國","請旅客依照合約先完成後續之行程再離團","告知旅客之權利義務並必須盡善良管理人之責","直接通報國外組團社逕行處理"],"a":"C","ok":"C","dup":[]},{"id":"1201-34","subj":"導遊實務(一)","track":"導遊","q":"依據洗錢防制物品出入境申報及通報辦法規定，旅客出入境，同一人於同日單一航次攜帶超越自用目的之鑽石、寶石及白金等，總價值逾等值新臺幣 遊","q":"依發展觀光條例規定，旅行業有何項情事，中央主管機關得公告之？","o":["經受罰鍰處分者","旅客申訴屬實者","經旅行業品質保障協會除會者","經票據交換所公告為拒絕往來戶者"],"a":"D","ok":"D","dup":[]},{"id":"2201-11","subj":"導遊實務(二)","track":"導遊","q":"導遊人員取得執業證後至少連續幾年以上未執行導遊業務者，應重行參加訓練結業，換領執業證後，始得執行業務，但因天災、疫情或其他事由，經中央主管機關得視實際需要公告延長之？","o":["2年","3年","4年","5年"],"a":"B","ok":"B","dup":[]},{"id":"2201-12","subj":"導遊實務(二)","track":"導遊","q":"依據現行旅行業管理規則之規定，對於乙種旅行業實收資本額不得少於多少？","o":["新臺幣 100 萬元","新臺幣 120 萬元","新臺幣 150 萬元","新臺幣 200 萬元"],"a":"B","ok":"B","dup":[]},{"id":"2201-13","subj":"導遊實務(二)","track":"導遊","q":"旅行業僱用之人員掩護非合格導遊執行接待或引導國外或大陸地區觀光旅客至中華民國旅遊者，應處罰鍰之範圍為何？","o":["新臺幣 2 千元以上，2 萬 5 千元以下罰鍰","新臺幣 2 千元以上，1 萬 5 千元以下罰鍰","新臺幣 3 千元以上，1 萬 5 千元以下罰鍰","新臺幣 3 千元以上，2 萬 5 千元以下罰鍰"],"a":"C","ok":"C","dup":[]},{"id":"2201-14","subj":"導遊實務(二)","track":"導遊","q":"旅行業者未取得經中央主管機關認可足以保障旅客權益之觀光公益法人會員資格，投保履約保險，有關投保最低金額之規定，下列敘述何者正確？","o":["綜合旅行社新臺幣 3,000 萬元","甲種旅行社新臺幣 1,500 萬元","乙種旅行社新臺幣 1,000 萬元","綜合旅行社增設分公司一家，應增加新臺幣 400 萬元"],"a":"D","ok":"D","dup":[]},{"id":"2201-15","subj":"導遊實務(二)","track":"導遊","q":"有關旅行業責任保險之敘述，下列何者錯誤？","o":["為保障出國期間之生命財產安全，旅客應於出國前自行向保險公司投保旅行業責任保險","旅行業責任保險投保範圍及金額，每一旅客意外死亡為新臺幣 200 萬元","旅行業責任保險投保範圍及金額，旅客家屬前往海外或來中華民國處理善後，所必需支出之費用為新臺幣 10 萬元","旅行業責任保險投保範圍及金額，旅客家屬前往國內旅遊善後處理費用為新臺幣 5 萬元"],"a":"A","ok":"A","dup":[]},{"id":"2201-16","subj":"導遊實務(二)","track":"導遊","q":"依發展觀光條例規定，下列行業配合觀光政策提升服務品質，經中央主管機關核定者，於營運期間，供其直接使用之不動產，應課徵之地價稅及房屋稅，得予適當減免？\n①觀光遊樂業\n②觀光旅館業\n③旅館業\n④民宿","o":["①②③","①②④","①③④","②③④"],"a":"A","ok":"A","dup":[]},{"id":"2201-17","subj":"導遊實務(二)","track":"導遊","q":"依旅行業管理規則規定，曾經營旅行業受廢止營業執照處分，尚未逾幾年者，不得為旅行業之經理人？","o":["2年","3年","4年","5年"],"a":"D","ok":"D","dup":[]},{"id":"2201-18","subj":"導遊實務(二)","track":"導遊","q":"「星河旅行社」是國內數一數二的旅行業，正值旅遊市場興盛期，目前尚有多家申請籌設之旅行業，依旅行業管理規則規定，下列那家旅行社名稱是無法通過的？","o":["興合旅行社","銀河旅行社","星空旅行社","宇宙旅行社"],"a":"A","ok":"A","dup":[]},{"id":"2201-19","subj":"導遊實務(二)","track":"導遊","q":"依旅行業管理規則規定，旅行業經理人訓練之受訓人員在訓練期間，因下列何項情形予以退訓者，不受退訓後 2 年內不得再參加訓練之限制？","o":["缺課節數逾十分之一者","由他人冒名頂替參訓","報名檢附之資格證明文件係偽造或變造者","受訓期間對講座或輔導員脅迫者"],"a":"A","ok":"A","dup":[]},{"id":"2201-20","subj":"導遊實務(二)","track":"導遊","q":"小新擔任導遊工作，帶團途經中橫太魯閣國家公園九曲洞路段附近，遭到落石砸穿巴士車頂，導致團員重傷送醫急救。小新除應即時妥當處置之外，應將經過情形於幾個小時之內回報那些單位？","o":["24 小時之內；回報交通部觀光局、受僱旅行業者或機關團體","24 小時之內；回報內政部營建署、受僱旅行業者或機關團體","48 小時之內；回報交通部觀光局、受僱旅行業者或機關團體","48 小時之內；回報內政部營建署、受僱旅行業者或機關團體"],"a":"A","ok":"A","dup":[]},{"id":"2201-21","subj":"導遊實務(二)","track":"導遊","q":"依導遊人員管理規則規定，參加導遊人員職前訓練，測驗成績不及格者，其處理之方式為何？","o":["補行測驗以 60 分為及格","補行測驗以 80 分為及格","應於 7 日內補行測驗一次，仍不及格者不得結業","應於 30 日內補行測驗一次，仍不及格者不得結業"],"a":"C","ok":"C","dup":[]},{"id":"2201-22","subj":"導遊實務(二)","track":"導遊","q":"依導遊人員管理規則規定，某人參加導遊職前訓練期間，報名檢附之資格證明文件係偽造或變造者，經退訓後幾年內不得參加導遊職前訓練？","o":["1年","2年","3年","5年"],"a":"B","ok":"B","dup":[]},{"id":"2201-23","subj":"導遊實務(二)","track":"導遊","q":"依導遊人員管理規則規定，導遊人員職前訓練，因產假、重病等事由，經核准延期測驗者，應於多少期間內申請測驗？","o":["3 個月","6 個月","1年","2年"],"a":"C","ok":"C","dup":[]},{"id":"2201-24","subj":"導遊實務(二)","track":"導遊","q":"對於判斷合法旅館標準，下列何者錯誤？","o":["在訂房網站中有上架之旅館","懸掛有各縣（巿）政府發給之旅館業專用標識者","領有各縣（巿）政府核發之旅館業登記證者","未全面核發前，領有各縣（巿）政府核發之「營利事業登記證」，其「營業項目」列有旅館業者"],"a":"A","ok":"A","dup":[]},{"id":"2201-25","subj":"導遊實務(二)","track":"導遊","q":"依民宿管理辦法規定，民宿經營者應投保責任保險，保險期間總保險金額最低新臺幣多少元？","o":["1,000 萬元","1,200 萬元","2,000 萬元","2,400 萬元"],"a":"D","ok":"D","dup":[]},{"id":"2201-26","subj":"導遊實務(二)","track":"導遊","q":"依觀光旅館業管理規則規定，在宜蘭縣申請興建一般觀光旅館，應向下列那一機關申請核准籌設？","o":["宜蘭縣政府","交通部觀光局","經濟部商業司","內政部營建署"],"a":"B","ok":"B","dup":[]},{"id":"2201-27","subj":"導遊實務(二)","track":"導遊","q":"依觀光遊樂業管理規則規定，觀光遊樂業之籌設屬重大投資案件者，應向下列那一機關申請？","o":["當地直轄市或縣（市）政府","交通部","財政部","經濟部"],"a":"B","ok":"B","dup":[]},{"id":"2201-28","subj":"導遊實務(二)","track":"導遊","q":"依水域遊憩活動管理辦法規定，水上摩托車活動與其他水域活動共用同一水域時，下列有關水上摩托車活動範圍之敘述何者錯誤？","o":["活動範圍應距領海基線或陸岸起算離岸 200 公尺至 1 公里之水域內","從陸域進出該活動區域之水道寬度至少 20 公尺","水上摩托車活動不得與非動力型水域活動共同使用相同時間","水上摩托車活動不得與非動力型水域活動共同使用相同區位"],"a":"B","ok":"B","dup":[]},{"id":"2201-29","subj":"導遊實務(二)","track":"導遊","q":"依觀光遊樂業管理規則規定，受理觀光遊樂業申請籌設案件，最長幾日內應將審查結論通知申請人？","o":["60 日","90 日","110 日","150 日"],"a":"C","ok":"C","dup":[]},{"id":"2201-30","su r natural environment.","To observe some endangered creatures."],"a":"A","ok":"A","dup":[],"ctx":"4201-76"},{"id":"4201-77","subj":"外國語(英語)","track":"導遊","q":"What does the word “jolted” mean?","o":["Shattered.","Shot.","Shook.","Shrank."],"a":"C","ok":"C","dup":[],"ctx":"4201-76"},{"id":"4201-78","subj":"外國語(英語)","track":"導遊","q":"What was the highlight of the author’s safari’s trip?","o":["He was surrounded by the most breathtaking landscapes he had ever seen.","He had the chance to see a pack of wild dogs up close.","He could experience the beauty and diversity of the natural world.","He could get close to some of the most famous and endangered animals in the world, like lions and gorillas."],"a":"B","ok":"B","dup":[],"ctx":"4201-76"},{"id":"4201-79","subj":"外國語(英語)","track":"導遊","q":"According to this passage, what can tourists learn from these knowledgeable safari guides?","o":["They can learn about the animals’ behavior and habits.","They can learn about endangered animal species.","They can learn about several African wildlife sanctuaries.","They can get knowledge about the splendor of nature."],"a":"A","ok":"A","dup":[],"ctx":"4201-76"},{"id":"4201-80","subj":"外國語(英語)","track":"導遊","q":"According to this passage, which of the following is NOT included in safari vacations besides animal ____ sightings?","o":["Hiking.","Observing birds.","Animal breeding.","Cultural encounters."],"a":"C","ok":"C","dup":[],"ctx":"4201-76"}]},Q=B.questions,P=B.passages,QM=Object.fromEntries(Q.map(q=>[q.id,q]));
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const L='ABCD';let name=localStorage.getItem('qn')||'',U=null,paper=null,tab='exam',net='';
const key=n=>'u_'+[...n].map(c=>c.codePointAt(0).toString(16)).join('_');
const url=()=>`${DB_URL}/users/${key(name)}.json`;
const norm=d=>({name,papers:d.papers||[],seen:d.seen||[],q:d.q||{}});
const now=()=>new Date().toLocaleString('zh-TW',{hour12:false});
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
async function pull(){const loc=JSON.parse(localStorage.getItem('qd_'+key(name))||'null');
 if(!DB_URL){net='local';return loc?norm(loc):norm({})}
 try{const d=await (await fetch(url())).json();net='cloud';return norm(d||loc||{})}catch(e){net='off';return loc?norm(loc):norm({})}}
async function save(mut){U=await pull();mut(U);localStorage.setItem('qd_'+key(name),JSON.stringify(U));
 if(DB_URL){try{await fetch(url(),{method:'PUT',body:JSON.stringify(U)});net='cloud'}catch(e){net='off'}}}
function draw(){let pick=shuffle(Q.filter(q=>!U.seen.includes(q.id))).slice(0,20),reset=[];
 if(pick.length<20){const ids=new Set(pick.map(q=>q.id));reset=shuffle(Q.filter(q=>!ids.has(q.id))).slice(0,20-pick.length).map(q=>q.id)}
 return{ids:pick.map(q=>q.id).concat(reset),reset,ans:{},t:now(),done:null}}
const pk=()=>'qp_'+key(name);
function savePaper(){localStorage.setItem(pk(),JSON.stringify(paper))}
function login(){$('#nav').hidden=true;$('#sw').hidden=true;$('#who').textContent='';
 app.innerHTML=`<div class="card pass"><h2 style="margin:0">請先登機報到</h2><p style="color:var(--sub)">輸入答題者姓名，成績與錯題會依姓名分開統計。換手機請輸入同一個名字。</p><input id="nm" placeholder="答題者姓名" value="${esc(name)}"><button class="btn" id="go">開始</button></div>`;
 $('#go').onclick=()=>{const v=$('#nm').value.trim();if(!v)return;name=v;localStorage.setItem('qn',v);boot()}}
async function boot(){app.innerHTML='<p class="foot">讀取紀錄中…</p>';U=await pull();
 paper=JSON.parse(localStorage.getItem(pk())||'null');
 $('#who').textContent=name;$('#sw').hidden=false;$('#nav').hidden=false;show('exam')}
$('#sw').onclick=()=>{name='';localStorage.removeItem('qn');login()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));
function show(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 ({exam:vExam,score:vScore,warn:vWarn})[t]();scrollTo(0,0)}
function banner(){return net==='cloud'?'':`<div class="warn">${net==='off'?'雲端連線失敗，目前只存在這台裝置。':'尚未設定雲端資料庫，紀錄只存在這台裝置。'}</div>`}
function vExam(){
 if(!paper){const left=Q.filter(q=>!U.seen.includes(q.id)).length;
  app.innerHTML=`<div class="card pass"><h3 style="margin:0 0 6px">本輪進度</h3><div class="bar"><span style="width:${(Q.length-left)/Q.length*100}%"></span></div><p style="color:var(--sub);margin:6px 0 14px">已完成 ${Q.length-left} / ${Q.length} 題，剩 ${left} 題（做完一輪才會重複）</p><button class="btn" id="new">領取新考卷（20題）</button>${banner()}</div>`;
  $('#new').onclick=()=>{paper=draw();savePaper();vExam()};return}
 const done=!!paper.done;let h='';
 paper.ids.forEach((id,i)=>{const q=QM[id],a=paper.ans[id];
  const okset=q.ok,right=a&&okset.includes(a);
  h+=`<div class="card pass"><div>${q.ctx?`<div class="ctx">${esc(P[q.ctx])}</div>`:''}<span class="no">${i+1}.</span> <span class="q">${esc(q.q)}</span><span class="tag">${q.subj}</span></div>`+
  q.o.map((o,k)=>{let c='opt';const l=L[k];
   if(done){if(okset.includes(l))c+=' ok';else if(a===l)c+=' bad'}else if(a===l)c+=' sel';
   return `<button class="${c}" data-i="${id}" data-l="${l}" ${done?'disabled':''}><i>${l}</i><span>${esc(o)}</span></button>`}).join('')+
  (done?`<div class="res ${right?'ok':'bad'}">${right?'✓ 正確':'✗ 錯誤，正確答案：'+(okset.length===4?'本題一律給分':okset.split('').join(' 或 '))}</div>`:'')+`</div>`});
 const n=Object.keys(paper.ans).length;
 if(done){const sc=paper.score;h=`<div class="card"><div class="stamp ${sc>=60?'pass-ok':''}"><b>${sc}</b>分</div><p class="foot">答對 ${sc/5} 題 / 共 20 題</p><button class="btn" id="again">再來一張</button></div>`+h}
 else h+=`<button class="btn" id="sub" ${n<20?'disabled':''}>交卷（已答 ${n}/20）</button>`;
 h+=`<div class="foot">填寫時間：${paper.t}${done?'　交卷：'+paper.done:''}</div>`+(net==='cloud'?'':banner());
 app.innerHTML=h;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{paper.ans[b.dataset.i]=b.dataset.l;savePaper();const y=scrollY;vExam();scrollTo(0,y)});
 if($('#sub'))$('#sub').onclick=submit;if($('#again'))$('#again').onclick=()=>{paper=null;localStorage.removeItem(pk());vExam()}}
async function submit(){const p=paper;let c=0;const items=p.ids.map(id=>{const r=QM[id].ok.includes(p.ans[id])?1:0;c+=r;return[id,p.ans[id],r]});
 p.score=c*5;p.done=now();savePaper();$('#sub').disabled=true;$('#sub').textContent='儲存中…';
 await save(u=>{u.papers.push({t:p.t,d:p.done,s:p.score,it:items});
  u.seen=p.reset.length?p.reset.slice():[...new Set(u.seen.concat(p.ids))];
  items.forEach(([id,,r])=>{const s=u.q[id]||[0,0,0];s[0]++;r?s[1]++:s[2]++;u.q[id]=s})});
 vExam();scrollTo(0,0)}
function vScore(){const ps=U.papers,avg=ps.length?ps.reduce((a,p)=>a+p.s,0)/ps.length:0;
 app.innerHTML=`<div class="card pass"><div style="display:flex;justify-content:space-around;text-align:center"><div><b style="font-size:28px">${ps.length}</b><br>已寫考卷</div><div><b style="font-size:28px">${ps.length?avg.toFixed(1):'–'}</b><br>平均分數</div></div></div>`+
 (ps.length?`<div class="card">${ps.map((p,i)=>[p,i]).reverse().map(([p,i])=>`<div class="row"><div>第 ${i+1} 張<br><small style="color:var(--sub)">${p.d||p.t}</small></div><div style="min-width:42%;text-align:right"><b style="color:${p.s>=60?'var(--ok)':'var(--bad)'}">${p.s} 分</b><div class="bar"><span style="width:${p.s}%"></span></div></div></div>`).join('')}</div>`:'<p class="foot">還沒有成績，先去寫一張考卷。</p>')+banner()}
function vWarn(){const r=Object.entries(U.q).filter(([,s])=>s[2]>0).map(([id,s])=>({q:QM[id],s,r:s[2]/s[0]})).filter(x=>x.q).sort((a,b)=>b.r-a.r||b.s[2]-a.s[2]||b.s[0]-a.s[0]).slice(0,5);
 app.innerHTML=r.length?r.map((x,i)=>`<div class="card pass"><b style="color:var(--bad)">錯誤率 ${(x.r*100).toFixed(0)}%</b>　<small>出現 ${x.s[0]} 次・答對 ${x.s[1]}・答錯 ${x.s[2]}</small><div class="q" style="margin-top:6px">${esc(x.q.q)}<span class="tag">${x.q.subj}</span></div><div class="opt ok"><i>${x.q.ok.length===4?'✓':x.q.ok[0]}</i><span>${esc(x.q.ok.length===4?'一律給分':x.q.o[L.indexOf(x.q.a)])}</span></div></div>`).join(''):'<p class="foot">目前沒有答錯的題目。</p>';}
name?boot():login();
</script></body></html>
